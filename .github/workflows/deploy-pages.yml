name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with base path
        env:
          PAGES_BASE: /sajjadmobiledev/
        run: npm run build

      - name: Prepare static output
        run: |
          touch dist/client/.nojekyll
          cp dist/client/index.html dist/client/404.html

      - name: Deploy to gh-pages branch
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git checkout --orphan gh-pages
          git rm -rf .
          cp -r dist/client/* .
          touch .nojekyll
          git add -A
          git commit -m "Deploy to GitHub Pages" || echo "No changes"
          git push origin gh-pages --force            echo "value=/$REPO/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static site
        env:
          PAGES_BASE: ${{ steps.base.outputs.value }}
        run: bun run build

      - name: Prepare static output
        run: |
          touch dist/client/.nojekyll
          cp dist/client/index.html dist/client/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
